<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор</h1>

        <div class="inputs">
            <input type="text" id="num1" placeholder="Первое число" autocomplete="off">
            <input type="text" id="num2" placeholder="Второе число" autocomplete="off">
        </div>

        <div class="buttons">
            <button id="sum">Сумма</button>
            <button id="diff">Разность</button>
            <button id="mult">Произведение</button>
            <button id="div">Деление</button>
        </div>

        <div id="result" class="result">Результат</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
